name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "41 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build   # strict typecheck + production bundle
